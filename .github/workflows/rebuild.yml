name: Rebuild foundation
on:
  push:
    paths: ['rebuild/**', '.github/workflows/rebuild.yml', 'scripts/rebuild-ci-config.py']
  pull_request:
    paths: ['rebuild/**', '.github/workflows/rebuild.yml', 'scripts/rebuild-ci-config.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker-dependency-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rebuild/infra/scheduler/worker-runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.25'
          python-version: '3.11.15'
          working-directory: rebuild/infra/scheduler/worker-runtime
          enable-cache: false
      - name: Install pinned resolver Python explicitly
        run: uv python install 3.11.15
      - name: Check combined worker lock without installing dependencies
        run: uv lock --check --python 3.11.15
      - name: Check hashed requirements export without building an image
        shell: bash
        run: |
          uv export --locked --no-config --format requirements-txt --no-dev --no-emit-project --no-header --output-file "$RUNNER_TEMP/omniforge-worker-requirements.txt"
          diff -u requirements.txt "$RUNNER_TEMP/omniforge-worker-requirements.txt"
  windows-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rebuild
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.25'
          python-version: '3.11.15'
          working-directory: rebuild
          enable-cache: false
      - run: uv sync --locked
      - name: Check offline API contract
        run: uv run --locked --no-sync python -m services.api.smoke
      - name: Check credential adapter contracts without live store access
        run: uv run --locked --no-sync python -B -m unittest discover -s tests/contracts/secrets -v
      - name: Check standalone provider contracts without network or OS credentials
        run: uv run --locked --no-sync python -B -m unittest discover -s tests/contracts/providers -v
      - name: Check explicit worker configuration with injected I/O
        run: uv run --locked --no-sync python -B -m unittest discover -s tests/contracts/worker -v
  postgres-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres@sha256:32ebb7185baf2c9d38f91684417d140c0745aeff5082dfbb62edb330c2af6197
        env:
          POSTGRES_USER: omniforge_rebuild
          POSTGRES_DB: omniforge_rebuild
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U omniforge_rebuild -d omniforge_rebuild"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: rebuild
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.25'
          python-version: '3.11.15'
          working-directory: rebuild
          enable-cache: false
      - run: uv sync --locked
      - name: Check offline API contract
        run: uv run --locked --no-sync python -m services.api.smoke
      - name: Prepare ephemeral test configuration outside checkout
        run: uv run --locked --no-sync python ../scripts/rebuild-ci-config.py
      - name: Check Linux worker configuration with injected I/O
        run: uv run --locked --no-sync python -B -m unittest discover -s tests/contracts/worker -v
      - name: Check portable evidence and provenance contracts
        env:
          OMNIFORGE_EVIDENCE_PROOF_ROOT: ${{ runner.temp }}/omniforge-evidence-proof
        run: uv run --locked --no-sync python -B -m tests.contracts.evidence.check
      - name: Apply isolated database migration
        run: uv run --locked --no-sync python -m infra.core.migrate
      - name: Seed synthetic local principal
        run: uv run --locked --no-sync python -m infra.core.bootstrap seed "$OMNIFORGE_CI_ROOT"
      - name: Check persisted cases, grants, artifacts and recovery
        run: uv run --locked --no-sync python tests/integration/core/check.py
      - name: Check deterministic provider against persisted core authority
        run: uv run --locked --no-sync python -B -m unittest tests.integration.core.provider_integration -v
      - name: Check case-scoped provider metadata without credentials or network
        run: uv run --locked --no-sync python -B -m unittest tests.integration.core.profiles -v
      - name: Check persisted profile binding with fake input and storage
        run: uv run --locked --no-sync python -B -m unittest tests.integration.core.binding -v
      - name: Check persisted run admission, cancellation and event replay
        run: uv run --locked --no-sync python -B -m unittest tests.integration.scheduler.core_journal -v
      - name: Check fenced execution and output transactions with a fake scheduler
        run: uv run --locked --no-sync python -B -m unittest tests.integration.scheduler.core_execution -v
      - name: Check async delivery handshakes against persisted core with injected scheduler
        run: uv run --locked --no-sync python -B -m unittest tests.integration.scheduler.core_delivery -v
      - name: Check active cancellation and cleanup receipts with injected scheduler
        run: uv run --locked --no-sync python -B -m unittest tests.integration.scheduler.core_cancellation -v
      - name: Check authenticated event streams and physical read settlement
        run: uv run --locked --no-sync python -B -m tests.integration.core.streaming_runner
  generated-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rebuild
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.25'
          python-version: '3.11.15'
          working-directory: rebuild
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.1'
      - run: uv sync --locked
      - name: Install pinned client generator
        run: npm ci --prefix infra/core/client-tooling --ignore-scripts --no-audit --no-fund
      - name: Regenerate API schema and typed client
        run: uv run --locked --no-sync python -m infra.core.generate_client
      - name: Check generated snapshot drift
        run: |
          git diff --exit-code -- packages/contracts/openapi.json packages/contracts/generated
          test -z "$(git ls-files --others --exclude-standard -- packages/contracts/generated)"
      - name: Check generated TypeScript
        run: node infra/core/client-tooling/node_modules/typescript/bin/tsc -p infra/core/client-tooling/tsconfig.json
  cases-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rebuild/apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.1'
      - name: Install locked web dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile and build the Cases workspace
        run: npm run build
      - name: Install headless Chromium for bounded browser checks
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Check synthetic browser journeys and transport contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run dev > "$RUNNER_TEMP/omniforge-ui.log" 2>&1 &
          ui_pid=$!
          trap 'kill "$ui_pid" 2>/dev/null || true; wait "$ui_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:64110/ > /dev/null; then
              ready=true
              break
            fi
            sleep 0.5
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/omniforge-ui.log"
            exit 1
          fi
          node node_modules/@playwright/test/cli.js test --grep-invert 'coordinated local API'
  scheduler-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rebuild
    env:
      UV_PYTHON_DOWNLOADS: never
      UV_HTTP_RETRIES: '0'
      PYTHONPATH: ${{ github.workspace }}/rebuild
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.25'
          python-version: '3.11.15'
          working-directory: rebuild
          enable-cache: false
      - name: Install pinned scheduler Python explicitly
        env:
          UV_PYTHON_DOWNLOADS: manual
        run: uv python install 3.11.15
      - name: Install locked standalone scheduler dependencies
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/omniforge-scheduler-ci-venv
        run: uv sync --project infra/scheduler --locked --python 3.11.15
      - name: Check safe scheduler CLI errors without services or credentials
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/omniforge-scheduler-ci-venv
          OF_SCHEDULER_PRIVATE_ROOT: ${{ runner.temp }}/omniforge-scheduler-offline-placeholder
        run: uv run --project infra/scheduler --locked --no-sync python -B -m unittest tests.integration.scheduler.test_error_boundary -v
      - name: Check injected scheduler port without services or credentials
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/omniforge-scheduler-ci-venv
        run: uv run --project infra/scheduler --locked --no-sync python -B -m unittest tests.contracts.scheduler.test_hatchet_port -v
      - name: Check explicit transport construction with injected resources
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/omniforge-scheduler-ci-venv
        run: uv run --project infra/scheduler --locked --no-sync python -B -m unittest tests.contracts.scheduler.test_hatchet_factory -v
      - name: Check offline receiver configuration and ownership contract
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/omniforge-scheduler-ci-venv
        run: uv run --project infra/scheduler --locked --no-sync python -B -m unittest tests.contracts.scheduler.test_native_client -v
      - name: Check pinned receiver source adaptation with injected resources
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/omniforge-scheduler-ci-venv
        run: uv run --project infra/scheduler --locked --no-sync python -B -m unittest tests.contracts.scheduler.test_receiver_adaptation -v
