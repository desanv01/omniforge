name: Detection helper checks
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s lab/purple/tests
      - run: python -m unittest discover -s scripts/tests
