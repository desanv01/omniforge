name: Backend
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_DB: artex_test
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U artex -d artex_test'
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ARTEX_PG_DSN: postgres://artex:isolated-ci-only@localhost:5432/artex_test?sslmode=disable
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build backend
        run: go build -p 4 ./...
      - name: Check English responses and update packaging
        run: go test -p 1 ./... -run 'Test.*Localized|TestPrintBanner|TestLangDirective|TestWrapup|TestChatMentionParsing|TestAssetName' -count=1 -timeout=3m
      - name: Check focused application and regression tests
        run: >-
          go test -p 1 ./closedloop ./investigation ./securitysource ./server
          -run 'Test(Evaluate|Investigation|PurpleSource|ClosedLoopRuleFailedQueryStillHasSafeProvenance|TaskMetadataPatchReturnsRenameAndPin|AegisOverviewRequiresAuthentication)'
          -count=1 -timeout=5m
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
