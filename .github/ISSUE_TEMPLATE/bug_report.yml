name: Bug report
description: Report unexpected application behavior.
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: Remove credentials, tokens, target secrets, and private logs.
