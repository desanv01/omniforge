[project]
name = "omniforge-core"
version = "0.1.0"
description = "Isolated OmniForge control-plane prototype"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.161.1",
  "pydantic==2.14.1",
  "uvicorn==0.54.0",
  "sqlalchemy==2.1.6",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.6",
  "python-multipart==0.0.32",
]

[dependency-groups]
dev = ["httpx2==2.16.0"]

[tool.uv]
package = false
